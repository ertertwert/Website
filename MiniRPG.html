<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mini RPG</title>
<link rel="icon" href="MiniRPG.ico">   <!-- the little picture on the browser tab -->
<style>
  html, body { margin: 0; height: 100%; background: #0b0d1a; color: #9aa3c7; font-family: "Courier New", monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  /* main.js sets the canvas size so that one game pixel is always a whole number of screen pixels (stays sharp) */
  canvas { aspect-ratio: 4 / 3; image-rendering: pixelated; border: 2px solid #2a3166; }
  p { margin: 0; font-size: 14px; text-align: center; line-height: 1.5; }
  /* full screen: the game fills the monitor and the help text is hidden */
  :fullscreen canvas { border: none; }
  :fullscreen p { display: none; }
</style>
</head>
<body>
  <!-- the game is 320x240 pixels inside; main.js enlarges it 2x, 3x, 4x... to suit the screen -->
  <canvas id="game" width="960" height="720"></canvas>
  <p>Arrows / WASD: move &nbsp;|&nbsp; Z / Enter: talk, confirm &nbsp;|&nbsp; X / Esc: menu, cancel &nbsp;|&nbsp; Tab: world map &nbsp;|&nbsp; Mouse: left click walk / choose, right click menu<br>
     Ctrl+S: quick save &nbsp;|&nbsp; F: full screen (in battle: favorite) &nbsp;|&nbsp; V: screen size &nbsp;|&nbsp; C: scan lines &nbsp;|&nbsp; M: mute</p>

  <!-- Order matters: each file uses things from the ones above it.
       (?v=31 only makes sure the browser loads the newest copy of each file.) -->
  <script src="js/data.js?v=31"></script>     <!-- stats, spells, gear, enemies, formulas -->
  <script src="js/sprites.js?v=31"></script>  <!-- pixel art and drawing helpers -->
  <script src="js/maps.js?v=31"></script>     <!-- town and world map -->
  <script src="js/ui.js?v=31"></script>       <!-- menus and message boxes -->
  <script src="js/audio.js?v=31"></script>    <!-- music and sound effects -->
  <script src="js/save.js?v=31"></script>     <!-- save and load -->
  <script src="js/battle.js?v=31"></script>   <!-- turn-based battles -->
  <script src="js/tower.js?v=31"></script>    <!-- the Endless Tower (New Game+) -->
  <script src="js/main.js?v=31"></script>     <!-- keyboard, walking, shops, game loop -->
</body>
</html>
